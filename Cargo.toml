[workspace]
members = [
    "crates/common",
    "crates/agent",
    "crates/server",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Alex Trichot <alexandre.trichot@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# MCP SDK
rmcp = { version = "1.5", features = ["server", "client", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }

# HTTP server
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit"] }

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Concurrent data structures
dashmap = "6"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls", "form"], default-features = false }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Auth
jsonwebtoken = "9"

# Templates
askama = "0.12"
askama_axum = "0.4"

# JSON Schema
schemars = "0.8"

# URL encoding
urlencoding = "2"

# Semver parsing
semver = "1"

# Static file embedding
rust-embed = "8"
mime_guess = "2"

# Internal crates
common = { path = "crates/common" }
